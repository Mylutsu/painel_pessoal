<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Painel">

    <title>{% block title %}Painel Pessoal de Anotações{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="manifest" href="/manifest.json"> 
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <!-- Cabeçalho Base da Aplicação -->
        <header class="main-header">
            <div class="header-content">
                <h1>📌 Painel Pessoal</h1>
                <div class="header-actions">
                    <button id="theme-toggle" class="btn-theme" title="Alternar Tema">🌙</button>
                    
                    {% if session.get('usuario_id') %}
                        <a href="{{ url_for('index') }}" class="btn-nav">🏠 Início</a>
                        <a href="{{ url_for('calendario') }}" class="btn-nav">📅 Calendário</a>
                        <a href="{{ url_for('concluidas') }}" class="btn-nav">✅ Concluídas</a>
                        <a href="{{ url_for('lixeira') }}" class="btn-nav">🗑️ Lixeira</a>
                        <a href="{{ url_for('logout') }}" class="btn-nav" style="background-color: #ef4444; color: white;">🚪 Sair</a>
                    {% endif %}
                </div>
            </div>
        </header>

        <!-- Área onde cada página injeta seu próprio conteúdo -->
        <main class="content-grid">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Script Global (Modo Escuro e PWA) -->
    <script>
        const themeBtn = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme');

        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            if (themeBtn) themeBtn.innerText = '☀️';
        }

        if (themeBtn) {
            themeBtn.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                themeBtn.innerText = isDark ? '☀️' : '🌙';
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registrado!'))
                    .catch(err => console.error('Erro no SW:', err));
            });
        }

        // 1. Pede permissão ao usuário para mostrar Notificações do Navegador
        document.addEventListener("DOMContentLoaded", function() {
            if ("Notification" in window && Notification.permission === "default") {
                Notification.requestPermission();
            }
            
            // Verifica notas pendentes a cada 1 minuto (60000ms)
            verificarLembretesProximos();
            setInterval(verificarLembretesProximos, 60000);
        });

        function verificarLembretesProximos() {
            // Busca via rota rápida no Flask as notas de HOJE
            fetch('/api/lembretes-hoje')
                .then(response => response.json())
                .then(notas => {
                    const agora = new Date();

                    notas.forEach(nota => {
                        if (!nota.hora_vencimento) return;

                        // Converte data + hora da nota para um objeto Date
                        const [horas, minutos] = nota.hora_vencimento.split(':');
                        const horarioNota = new Date();
                        horarioNota.setHours(parseInt(horas), parseInt(minutos), 0, 0);

                        // Diferença em minutos entre AGORA e o HORÁRIO DA NOTA
                        const diffMinutos = Math.round((horarioNota - agora) / 60000);

                        // Se faltar entre 29 e 30 minutos (ou 9 e 10 minutos)
                        if (diffMinutos === 30 || diffMinutos === 10) {
                            dispararNotificacaoPopup(nota, diffMinutos);
                        }
                    });
                });
        }

        function dispararNotificacaoPopup(nota, minutosRestantes) {
            const titulo = `⏰ Lembrete: ${nota.titulo}`;
            const opcoes = {
                body: `Seu compromisso é em ${minutosRestantes} minutos! (${nota.hora_vencimento})`,
                icon: '/static/favicon.ico' // Opcional
            };

            // Se o navegador deu permissão, mostra notificação nativa
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(titulo, opcoes);
            } else {
                // Caso contrário, mostra um alerta simples na tela
                alert(`${titulo}\n\n${opcoes.body}`);
            }
        }

    </script>
    {% block scripts %}{% endblock %}


</body>
</html>
