{% extends "base.html" %}

{% block title %}Editar Anotação - Painel Pessoal{% endblock %}

{% block content %}
<main class="edit-container">
    <div class="card-form">
        <h2>✏️ Editar "{{ nota.titulo }}"</h2>
        
        <form action="{{ url_for('editar', id=nota.id) }}" method="POST">
            <div class="form-group">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" name="titulo" value="{{ nota.titulo }}" required>
            </div>

            <div class="form-group">
                <label for="categoria">Categoria</label>
                <select id="categoria" name="categoria">
                    {% for c in categorias %}
                        <option value="{{ c.nome }}" {% if c.nome == nota.categoria %}selected{% endif %}>
                            {{ c.emoji }} {{ c.nome }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="prioridade">Prioridade</label>
                <select id="prioridade" name="prioridade">
                    <option value="Alta" {% if nota.prioridade == 'Alta' %}selected{% endif %}>🔴 Alta</option>
                    <option value="Média" {% if nota.prioridade == 'Média' %}selected{% endif %}>🟡 Média</option>
                    <option value="Baixa" {% if nota.prioridade == 'Baixa' %}selected{% endif %}>🟢 Baixa</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tipo">Tipo de Nota</label>
                <select id="tipo" name="tipo">
                    <option value="texto" {% if nota.tipo == 'texto' %}selected{% endif %}>📝 Texto</option>
                    <option value="checklist" {% if nota.tipo == 'checklist' %}selected{% endif %}>☑️ Checklist</option>
                </select>
            </div>

            <div class="form-group">
                <label for="conteudo">Conteúdo / Descrição</label>
                <textarea id="conteudo" name="conteudo" rows="4">{{ nota.conteudo or '' }}</textarea>
            </div>

            <div class="form-row" style="display: flex; gap: 12px;">
                <div class="form-group" style="flex: 1;">
                    <label for="data_vencimento">Data de Vencimento</label>
                    <input type="date" id="data_vencimento" name="data_vencimento" value="{{ nota.data_vencimento or '' }}">
                </div>

                <div class="form-group" style="flex: 1;">
                    <label for="dias_aviso">Avisar quantos dias antes?</label>
                    <input type="number" id="dias_aviso" name="dias_aviso" value="{{ nota.dias_aviso or 3 }}" min="1" max="30">
                </div>
            </div>

            <div class="form-group">
                <label for="recorrencia">Repetir (Recorrência)</label>
                <select name="recorrencia" id="recorrencia">
                    <option value="Nenhuma" {% if nota.recorrencia == 'Nenhuma' or not nota.recorrencia %}selected{% endif %}>❌ Não repetir</option>
                    <option value="Semanal" {% if nota.recorrencia == 'Semanal' %}selected{% endif %}>📅 Semanal (A cada 7 dias)</option>
                    <option value="Mensal" {% if nota.recorrencia == 'Mensal' %}selected{% endif %}>🔄 Mensal (Todo mês)</option>
                    <option value="Anual" {% if nota.recorrencia == 'Anual' %}selected{% endif %}>🎂 Anual (Todo ano)</option>
                </select>
            </div>

            <div class="form-actions" style="margin-top: 20px;">
                <button type="submit" class="btn-principal">💾 Salvar Alterações</button>
                <a href="{{ url_for('index') }}" class="btn-cancelar">Cancelar</a>
            </div>
        </form>
    </div>
</main>
{% endblock %}
