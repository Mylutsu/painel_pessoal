<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Anotação - Painel Pessoal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- Cabeçalho -->
        <header class="main-header">
            <div class="header-content">
                <h1>✏️ Editar Anotação</h1>
                <div class="header-actions">
                    <button id="theme-toggle" class="btn-theme" title="Alternar Tema">🌙</button>
                    <a href="{{ url_for('calendario') }}" class="btn-nav">📅 Calendário</a>
                    <a href="{{ url_for('index') }}" class="btn-nav">📌 Painel Principal</a>
                </div>
            </div>
        </header>

        <main class="edit-container">
            <div class="card-form">
                <h2>Editar "{{ nota[1] }}"</h2>
                
                <form action="{{ url_for('editar', id=nota[0]) }}" method="POST">
                    <div class="form-group">
                        <label for="titulo">Título:</label>
                        <input type="text" name="titulo" id="titulo" value="{{ nota[1] }}" required>
                    </div>

                    <div class="form-group">
                        <label for="tipo">Tipo de Nota:</label>
                        <select name="tipo" id="tipo">
                            <option value="texto" {% if nota[5] == 'texto' %}selected{% endif %}>📝 Texto Livre</option>
                            <option value="checklist" {% if nota[5] == 'checklist' %}selected{% endif %}>☑️ Checklist / Lista</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="conteudo">Conteúdo / Descrição:</label>
                        <textarea name="conteudo" id="conteudo" rows="4">{{ nota[2] or '' }}</textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="categoria">Categoria:</label>
                            <select name="categoria" id="categoria">
                                {% for cat in categorias %}
                                    <option value="{{ cat[1] }}" {% if nota[3] == cat[1] %}selected{% endif %}>
                                        {{ cat[2] }} {{ cat[1] }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="prioridade">Prioridade:</label>
                            <select name="prioridade" id="prioridade">
                                <option value="Baixa" {% if nota[4] == 'Baixa' %}selected{% endif %}>🟢 Baixa</option>
                                <option value="Média" {% if nota[4] == 'Média' %}selected{% endif %}>🟡 Média</option>
                                <option value="Alta" {% if nota[4] == 'Alta' %}selected{% endif %}>🔴 Alta</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="data_vencimento">Vencimento:</label>
                            <input type="date" name="data_vencimento" id="data_vencimento" value="{{ nota[7] or '' }}">
                        </div>

                        <div class="form-group">
                            <label for="dias_aviso">Aviso (dias):</label>
                            <input type="number" name="dias_aviso" id="dias_aviso" value="{{ nota[8] or 3 }}" min="1" max="30">
                        </div>
                    </div>

                    <div class="form-actions-row">
                        <button type="submit" class="btn-principal">💾 Salvar Alterações</button>
                        <a href="{{ url_for('calendario') }}" class="btn-secundario">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        // Alternador de Modo Escuro
        const themeBtn = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme');

        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeBtn.innerText = '☀️';
        }

        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            let theme = 'light';
            if (document.body.classList.contains('dark-mode')) {
                theme = 'dark';
                themeBtn.innerText = '☀️';
            } else {
                themeBtn.innerText = '🌙';
            }
            localStorage.setItem('theme', theme);
        });
    </script>
</body>
</html>
