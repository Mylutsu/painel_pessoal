<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário - Painel Pessoal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- Biblioteca FullCalendar v6 (CDN JS & PT-BR) -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core/locales/pt-br.global.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Cabeçalho -->
        <header class="main-header">
            <div class="header-content">
                <div>
                    <h1>📅 Calendário de Compromissos</h1>
                    <p class="lixeira-header-info">Visualize suas notas e prazos em formato mensal e semanal.</p>
                </div>
                <div class="header-actions">
                    <button id="theme-toggle" class="btn-theme" title="Alternar Tema">🌙</button>
                    <a href="{{ url_for('index') }}" class="btn-nav">📌 Painel Principal</a>
                    <a href="{{ url_for('concluidas') }}" class="btn-nav">✅ Concluídas</a>
                    <a href="{{ url_for('lixeira') }}" class="btn-nav">🗑️ Lixeira</a>
                </div>
            </div>
        </header>

        <!-- Container do Calendário -->
        <main>
            <div class="calendar-card">
                <div id="calendar"></div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            
            // Inicialização do FullCalendar
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'pt-br',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek'
                },
                buttonText: {
                    today: 'Hoje',
                    month: 'Mês',
                    week: 'Semana'
                },
                events: '/api/eventos',
                eventClick: function(info) {
                    // Direciona para a página de edição da nota clicada
                    window.location.href = '/editar/' + info.event.id;
                }
            });

            calendar.render();

            // Sincronização do Modo Escuro
            const themeBtn = document.getElementById('theme-toggle');
            const currentTheme = localStorage.getItem('theme');

            if (currentTheme === 'dark') {
                document.body.classList.add('dark-mode');
                themeBtn.innerText = '☀️';
            }

            themeBtn.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                let theme = 'light';
                if (document.body.classList.contains('dark-mode')) {
                    theme = 'dark';
                    themeBtn.innerText = '☀️';
                } else {
                    themeBtn.innerText = '🌙';
                }
                localStorage.setItem('theme', theme);
            });
        });
    </script>
</body>
</html>
