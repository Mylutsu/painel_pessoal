{% extends "base.html" %}

{% block title %}Cadastro - Painel de Notas{% endblock %}

{% block content %}
<div style="grid-column: 1 / -1; width: 100%; display: flex; justify-content: center; align-items: center; padding: 40px 16px;">
    <div class="card-form" style="width: 100%; max-width: 400px; margin: 0 auto;">
        <div class="auth-header" style="margin-bottom: 20px; text-align: center;">
            <h2 style="font-size: 22px; font-weight: 800; margin: 0;">📝 Criar Nova Conta</h2>
        </div>

        <form action="{{ url_for('cadastro') }}" method="POST">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Seu Nome" required autofocus>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-principal" style="margin-top: 12px; width: 100%;">Cadastrar</button>
        </form>

        <div class="auth-footer" style="text-align: center; margin-top: 16px; font-size: 14px;">
            Já possui uma conta? <a href="{{ url_for('login') }}">Faça login</a>
        </div>
    </div>
</div>
{% endblock %}
